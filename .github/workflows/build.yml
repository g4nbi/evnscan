name: Build deb
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install dpkg ldid
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: envscan-deb
          path: build/*.deb
